name: Django CI & Test Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Django Checks & Test Suite
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: "ci-secret-key-sample-for-testing-purposes-1234567890-secure"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      CSRF_TRUSTED_ORIGINS: "http://127.0.0.1,http://localhost"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Check
        run: |
          python manage.py check

      - name: Run Django Production Deployment Check
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-production-deploy-check-key-1234567890-secure-sample"
        run: |
          python manage.py check --deploy

      - name: Verify Static Asset Collection
        run: |
          python manage.py collectstatic --noinput

      - name: Execute Automated Test Suite
        run: |
          python manage.py test --verbosity=2
